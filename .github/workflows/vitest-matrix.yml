name: VitestMatrix
"on":
  push:
    branches:
    - vitest-matrix/**
  schedule:
  - cron: 30 5 * * 1,3
env:
  BROWSERSLIST_IGNORE_OLD_DATA: "1"
jobs:
  test-v24:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dummy1:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        dummy2:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 1
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        package-manager-cache: false
    - name: Cache node modules and firebase emulators
      uses: actions/cache@v5
      with:
        path: |
          ~/.rush
          ~/.pnpm-store
          common/temp
          **/node_modules
          ~/.cache/firebase/emulators
        key: ${{ runner.os }}-modules-emulators-node24-pnpm10-v1-${{ hashFiles('rush.json', 'common/config/rush/pnpm-config.json', 'common/config/rush/.npmrc', '**/pnpm-lock.yaml') }}
    - name: Add rush directory to PATH
      run: echo PATH=$PWD/common/scripts/:$PATH >> $GITHUB_ENV
    - name: Install dependencies
      run: rush install
    - name: Build eisbuk packages
      run: rush build
    - name: Run tests
      run: cd packages/client && rushx test:emulators:ci
