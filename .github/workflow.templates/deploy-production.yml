#! YAML library files must be named *.lib.yml
#@ load("setup.lib.yml", "checkout")
#@ load("cache.lib.yml", "cache_node", "cache_cypress")
#@ load("rush.lib.yml", "rush_add_path", "rush_install", "rush_build")

name: Deploy to production

"on":
  push:
    branches:
      #! Deploys are decoupled from merges: master no longer deploys. To release,
      #! fast-forward the `production` branch to the commit you want live:
      #!   git push origin <commit-or-master>:production
      - production
      - test/production-deployment

#! Same stopgap as the CI workflows: the stale caniuse-lite snapshot in the
#! lockfile makes Browserslist warn on stderr and rush turn that into exit 1.
#! Remove once the lockfile is refreshed.
env:
  BROWSERSLIST_IGNORE_OLD_DATA: "1"

#! Never run two deploys at the same time: the second waits for the first.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    environment: Production
    runs-on: ubuntu-latest
    #! A deploy that rebuilds every function (e.g. a runtime change) takes a while.
    timeout-minutes: 30
    steps:
      - name: Install expect
        run: sudo apt-get -y install expect
      -  #@ checkout()
      - name: Test the deploy wrapper
        run: common/scripts/test-deploy-firebase-expect.sh
        timeout-minutes: 3
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Test the deployment verifier and preflight
        run: node --test common/scripts/verify-deployment.test.js common/scripts/preflight-deploy.test.js
        timeout-minutes: 3
      -  #@ cache_node()
      -  #@ rush_add_path()
      -  #@ rush_install()
      #! Stop here, before anything is built or released, if the deploy would not
      #! use the pinned Firebase CLI and Node 22 functions (#986).
      - name: Preflight, deploy toolchain
        run: node common/scripts/preflight-deploy.js
        timeout-minutes: 3
      -  #@ rush_build()
      - name: Inject slug/short variables
        uses: rlespinasse/github-slug-action@v4
      - name: Generate name for sentry release
        run: echo "SENTRY_RELEASE=$(date +%Y-%m-%d)-${{ env.GITHUB_SHA_SHORT }}" >> $GITHUB_ENV
      - name: Build app
        run: cd packages/client && rushx build:prod
        env:
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          REACT_APP_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          REACT_APP_SENTRY_DSN: ${{ secrets.SENTRY_IGORICE_DSN }}
          REACT_APP_SENTRY_ENVIRONMENT: production
          REACT_APP_SENTRY_RELEASE: ${{ env.SENTRY_RELEASE }}
      - name: Create Sentry release for client app
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: eisbuk
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
        with:
          environment: production
          sourcemaps: "./packages/client/dist/assets"
          version: ${{ env.SENTRY_RELEASE }}
      - name: Create Sentry release for firebase functions
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: eisbuk
          SENTRY_PROJECT: "functions"
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
        with:
          environment: production
          sourcemaps: "./packages/functions/dist/"
          version: ${{ env.SENTRY_RELEASE }}
      - name: Write service account key
        run: |
          cat > /tmp/key.json <<EOF
          ${{ secrets.GCP_KEY_JSON }}
          EOF
      - name: Deploy to firebase
        run: |
          echo FUNCTIONS_SENTRY_DSN="$FUNCTIONS_SENTRY_DSN" > packages/functions/.env
          echo REACT_APP_SENTRY_RELEASE="$REACT_APP_SENTRY_RELEASE" >> packages/functions/.env
          rush deploy:production
        env:
          FUNCTIONS_SENTRY_DSN: ${{ secrets.FUNCTIONS_SENTRY_DSN }}
          REACT_APP_SENTRY_RELEASE: ${{ env.SENTRY_RELEASE }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/key.json
      #! A green deploy step is not proof that production changed (#986): check the
      #! release id in the served bundle and in the environment of every function
      #! exported by packages/functions/dist/index.js (built by the predeploy hook).
      #! No --since: firebase-tools skips functions whose source and env are
      #! unchanged (same commit redeployed the same day), the release id still matches.
      - name: Verify that production runs this release
        run: >-
          node common/scripts/verify-deployment.js
          --release "$SENTRY_RELEASE"
          --runtime "nodejs$(node -p 'require("./packages/functions/package.json").engines.node')"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/key.json
      - name: debug
        if: steps.has_secret.outputs.HAS_SECRETS && (success() || failure())
        run: ls -l ; ls firebase-debug.log && cat firebase-debug.log || true
