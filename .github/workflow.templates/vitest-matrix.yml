#! YAML library files must be named *.lib.yml
#@ load("setup.lib.yml", "checkout")
#@ load("cache.lib.yml", "cache_node")
#@ load("rush.lib.yml", "rush_add_path", "rush_install", "rush_build")

#! You can run this workflow bu pushing to a branch with the name
#! cypress-matrix/<anything>

name: VitestMatrix

"on":
  push:
    branches:
      - "vitest-matrix/**"
  schedule:
    - cron: "30 5 * * 1,3"

#! See build.yml: silence the Browserslist staleness warning so rush build exits 0.
env:
  BROWSERSLIST_IGNORE_OLD_DATA: "1"

jobs:
  test-v24:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dummy1: [1, 2, 3, 4, 5, 6]
        dummy2: [1, 2, 3, 4, 5, 6]
    steps:
      -  #@ checkout()
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      -  #@ cache_node()
      -  #@ rush_add_path()
      -  #@ rush_install()
      -  #@ rush_build()
      - name: Run tests
        run: cd packages/client && rushx test:emulators:ci
